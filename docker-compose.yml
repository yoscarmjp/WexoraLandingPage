version: '3.8'

services:
  # Development environment with hot reload
  wexora-dev:
    build:
      context: .
      target: development
    container_name: wexora-landing-dev
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.vite
    environment:
      - NODE_ENV=development
    networks:
      - coolify

  # Production environment - No explicit port mapping for Coolify
  wexora-prod:
    build:
      context: .
      target: production
    container_name: wexora-landing-prod
    # Ports are managed automatically by Coolify
    # ports:
    #   - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - coolify
    profiles:
      - production

networks:
  coolify:
    external: true
    name: coolify
