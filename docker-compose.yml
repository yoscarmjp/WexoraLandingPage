version: '3.8'

services:
  # Development service
  wexora-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: wexora-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - wexora-network

  # Production service
  wexora-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: wexora-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - wexora-network
    profiles:
      - production

networks:
  wexora-network:
    driver: bridge
